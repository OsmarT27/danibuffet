<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani Buffet e Eventos — Experiências Únicas</title>
    
    <!-- Meta Tags para Redes Sociais (SEO Premium) -->
    <meta name="description" content="Dani Buffet e Eventos — Gastronomia refinada e planejamento impecável para tornar seu evento memorável.">
    <meta property="og:title" content="Dani Buffet e Eventos">
    <meta property="og:description" content="Buffet premium para eventos exclusivos e experiências inesquecíveis.">
    <meta property="og:image" content="assets/logo.png">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <!-- Google Fonts: Inter & Cormorant Garamond (Tipografia Clássica de Luxo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Free para Ícones Premium -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo Premium com Degradê Animado e Orbes de Luz Sombreados -->
    <div class="luxury-background">
        <div class="gradient-overlay"></div>
        <div class="radial-glow"></div>
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Wrapper Principal (Max-width 520px, Sem Scroll, Altamente Equilibrado) -->
    <main class="container animate-fade-in">
        
        <div class="content-wrapper">
            <!-- Seção Hero (Logo Ampliada e Tipografia Ultra Elegante) -->
            <header class="hero">
                <div class="logo-wrapper">
                    <img src="assets/logo.png" alt="Dani Buffet" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                    <div id="logo-fallback" class="logo-text-fallback" style="display: none;">DANI</div>
                </div>
                <h1 class="brand-title">Dani Buffet e Eventos</h1>
                <p class="brand-subtitle">Criando experiências gastronômicas inesquecíveis</p>
                <div class="sub-divider"></div>
            </header>

            <!-- Seção de Cartões (Links Principais) -->
            <section class="cards-wrapper">
                
                <!-- Card 1: WhatsApp -->
                <a href="https://wa.me/5587992054632?text=Ol%C3%A1!%20Tenho%20interesse%20em%20um%20or%C3%A7amento%20para%20um%20evento.%20Poderia%20me%20passar%20mais%20informa%C3%A7%C3%B5es%3F" target="_blank" rel="noopener" class="premium-card">
                    <div class="card-glow"></div>
                    <div class="card-content">
                        <div class="icon-box">
                            <i class="fa-brands fa-whatsapp icon-gradient"></i>
                        </div>
                        <div class="text-box">
                            <h2 class="card-title">WhatsApp</h2>
                            <p class="card-desc">Solicite um orçamento</p>
                        </div>
                        <div class="arrow-box">
                            <i class="fa-solid fa-chevron-right arrow-icon"></i>
                        </div>
                    </div>
                </a>

                <!-- Card 2: Cardápio -->
                <a href="https://drive.google.com/file/d/1Lug8wqz9y11BLL5-VK49Tq2m00iaLM9q/view" target="_blank" rel="noopener" class="premium-card">
                    <div class="card-glow"></div>
                    <div class="card-content">
                        <div class="icon-box">
                            <i class="fa-solid fa-utensils icon-gradient"></i>
                        </div>
                        <div class="text-box">
                            <h2 class="card-title">Cardápio</h2>
                            <p class="card-desc">Conheça nosso menu</p>
                        </div>
                        <div class="arrow-box">
                            <i class="fa-solid fa-chevron-right arrow-icon"></i>
                        </div>
                    </div>
                </a>

                <!-- Card 3: Instagram -->
                <a href="https://instagram.com/dani.buffet.eventos" target="_blank" rel="noopener" class="premium-card">
                    <div class="card-glow"></div>
                    <div class="card-content">
                        <div class="icon-box">
                            <i class="fa-brands fa-instagram icon-gradient"></i>
                        </div>
                        <div class="text-box">
                            <h2 class="card-title">Instagram</h2>
                            <p class="card-desc">Acompanhe nossos eventos</p>
                        </div>
                        <div class="arrow-box">
                            <i class="fa-solid fa-chevron-right arrow-icon"></i>
                        </div>
                    </div>
                </a>

            </section>
        </div>

        <!-- Rodapé Minimalista -->
        <footer class="footer">
            <p class="copyright">© 2026 Dani Buffet e Eventos. Todos os direitos reservados.</p>
            <p class="developer">Design por <a href="https://instagram.com/osmar.t.neto" target="_blank" rel="noopener" class="dev-link">Osmar Tavares</a></p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
